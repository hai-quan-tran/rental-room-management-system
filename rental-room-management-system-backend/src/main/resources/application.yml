spring:
  application:
    name: rental-room-management-system-backend

  # dev = dùng trực tiếp application-dev.yml (không cần set biến môi trường gì thêm).
  # prod = phải set SPRING_PROFILES_ACTIVE=prod, khi đó application-prod.yml đòi hỏi đủ biến môi trường mới chạy được.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate only validates it matches the entities.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:30}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  invoice-reminder:
    # 8h sáng các ngày 7, 8, 9 hằng tháng — nhắc quản lý chi nhánh về hóa đơn tháng trước còn thiếu/chưa xác nhận.
    cron: ${INVOICE_REMINDER_CRON:0 0 8 7-9 * *}
  tenant-bill-reminder:
    # 8h sáng ngày 11 hằng tháng — nhắc người đại diện hợp đồng thanh toán hóa đơn tháng trước còn nợ.
    cron: ${TENANT_BILL_REMINDER_CRON:0 0 8 11 * *}

logging:
  level:
    root: INFO
    com.rentalroom.management: DEBUG
